name: Travel Watch Twice Weekly Email

"on":
  workflow_dispatch:

  schedule:
    # Monday and Thursday at 07:00 Singapore time
    # 23:00 UTC on Sunday and Wednesday = 07:00 SGT
    - cron: "0 23 * * 0,3"

jobs:
  send-travel-watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Travel Watch
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python travel_watch_email.py
