name: Travel Watch Daily Email

on:
  schedule:
    # Runs every day at 07:00 Singapore time
    # 23:00 UTC = 07:00 SGT
    - cron: '0 23 * * *'

  # Allows us to test it manually
  workflow_dispatch:

jobs:
  send-travel-watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Travel Watch
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python travel_watch_email.py
